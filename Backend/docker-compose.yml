# PostgreSQL cục bộ cho demo / phát triển (CSDL riêng, không dùng chung với bất kỳ repo nào khác).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chungcu_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong .env hoặc môi trường}
    ports:
      - "5432:5432"
    volumes:
      - bluemoon_pgdata:/var/lib/postgresql/data
volumes:
  bluemoon_pgdata:
